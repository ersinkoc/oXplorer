name: Release

# Push a tag like v0.1.0 to build a signed, notarized universal DMG and a draft release.
# Without the Apple secrets the DMG is only ad-hoc signed (testers open it with right-click → Open).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Required secrets (Apple Developer account):
      #   APPLE_CERTIFICATE            base64 of the "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD   password of that .p12
      #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: ECOSTACK TECHNOLOGY OU (TEAMID)"
      #   APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_P8   App Store Connect API key for notarization
      #   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)                  updater key from `tauri signer generate`;
      #                                                         its public key goes into tauri.conf.json
      # The Finder extension is built and signed before Tauri bundles (beforeBundleCommand),
      # so the Developer ID certificate must already be in a keychain at that point.
      - name: Import signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Without a certificate the build is ad-hoc signed and not notarized (a beta for testers).
      # Tauri tries to sign (and fails) when these variables exist even empty, so
      # they're only set when there is a certificate.
      - name: Signing and notarization settings
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey.p8
          {
            echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # With the updater key present, also build the signed update archive and
          # latest.json that installed copies look for (tauri.conf.json, plugins.updater).
          args: >-
            --target universal-apple-darwin
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: OXplorer ${{ github.ref_name }}
          releaseDraft: true
          # v0.1.0-beta.1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
