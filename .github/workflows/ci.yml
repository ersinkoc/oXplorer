name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Bindings are up to date
        run: |
          pnpm bindings
          git diff --exit-code src/bindings.ts

      - name: Frontend (biome, tsc, vitest)
        run: pnpm check

      - name: Rust (fmt, clippy, tests)
        run: pnpm check:rust

      - name: Frontend build
        run: pnpm build
