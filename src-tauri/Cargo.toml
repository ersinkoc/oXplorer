[package]
name = "oxplorer"
version = "0.1.0"
description = "OXplorer — modern dual-pane file manager for macOS"
authors = ["Ersin / ECOSTACK TECHNOLOGY OÜ"]
license = "MIT"
edition = "2024"
rust-version = "1.95"

[lib]
# The `_lib` suffix avoids a lib/bin name clash (cargo#8519).
name = "oxplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-os = "2.4"
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-log = "2.10"
tauri-plugin-single-instance = "2.5"
tauri-plugin-clipboard-manager = "2.5"

# IPC type generation — Tauri 2 line is still RC, pin exactly.
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
dirs = "7"
libc = "0.2"
notify = "8.2"
notify-debouncer-full = "0.7"
xattr = "1.6"
plist = "1.10"
rayon = "1.12"
percent-encoding = "2"
tauri-plugin-drag = "2.1"
portable-pty = "0.9"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
unicode-normalization = "0.1"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"
flate2 = "1.1"
zstd = "0.14"
muda = { version = "0.20", default-features = false }
tauri-plugin-notification = "2"
tauri-plugin-updater = "~2.13"
tauri-plugin-process = "2"
gix = { version = "=0.90.0", default-features = false, features = ["status", "max-performance", "sha1"] }
opendal = { version = "=0.59.3", default-features = false, features = ["services-sftp", "services-webdav", "services-s3", "services-fs", "http-transport-reqwest", "reqwest-rustls-tls", "executors-tokio"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = "fat"
# Size over speed: ~30% smaller binary for ~10% slower listings (100k entries: 160 → 178 ms).
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quick-look-thumbnailing = "0.3"
objc2-quick-look-ui = "0.3"
objc2-uniform-type-identifiers = "0.3"
security-framework = "3.7"

# A selection of pedantic lints that catch real mistakes without much noise.
[lints.clippy]
cast_lossless = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
